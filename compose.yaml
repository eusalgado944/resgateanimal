services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: resgateanimal
      POSTGRES_DB: resgateanimal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resgateanimal -d resgateanimal"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    command: ["sh", "-c", "npm run migrate && exec node src/server.js"]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://resgateanimal:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/resgateanimal
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: 1
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      - api
volumes:
  database:
  uploads:
